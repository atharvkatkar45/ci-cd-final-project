
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: cleanup
spec:
  workspaces:
    - name: source
  steps:
    - name: remove-files
      image: alpine:3.20
      script: |
        #!/bin/sh
        find "$(workspaces.source.path)" -mindepth 1 -maxdepth 1 -exec rm -rf {} +

---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: nose
spec:
  workspaces:
    - name: source
  steps:
    - name: run-unit-tests
      image: python:3.10-slim
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -e
        pip install -r requirements.txt
        pip install nose
        python -c "import collections, collections.abc, sys; collections.Callable = collections.abc.Callable; import nose; sys.argv = ['nosetests', '-v']; nose.main()"
